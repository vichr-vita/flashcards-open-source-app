<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#000000" />
    <script>
      try {
        const savedTheme = localStorage.getItem("flashcards-web-theme-preference");
        const followsDarkSystem = matchMedia("(prefers-color-scheme: dark)").matches;
        const isDark = savedTheme === "dark" || (savedTheme !== "light" && followsDarkSystem);
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = isDark ? "#000000" : "#f5f5f7";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Nibomo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
