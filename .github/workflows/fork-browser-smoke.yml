name: Private Rust stack

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [vichr-fork]
    paths:
      - apps/server/**
      - apps/web/**
      - apps/auth/browser/**
      - apps/auth/integration/**
      - apps/docs/**
      - apps/backend/src/scheduling/**
      - vendor/**
      - infra/private/**
      - .dockerignore
      - db/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - clippy.toml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/check*.sh
      - scripts/with*test-db.sh
      - scripts/build-passkey.mjs
      - .github/workflows/fork-browser-smoke.yml

permissions:
  contents: read

jobs:
  private-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Install browser and compatibility-fixture dependencies
        run: |
          pnpm install --frozen-lockfile
          npm ci --prefix apps/auth
          npm ci --prefix apps/backend
          pnpm --dir apps/web exec playwright install --with-deps chromium webkit
      - name: Build the private browser Docker stage
        run: docker build --target browser --file infra/private/Dockerfile --tag lingvichr-private-browser-check .
      - name: Verify Rust, preserved database contracts, and browser flows
        run: bash scripts/check-rust-stack.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: private-stack-browser-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
